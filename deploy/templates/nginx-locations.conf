# Managed by BVT Grama Connect deploy/setup.sh. Edit the template, not this file.
# Everything the site serves. Included by the HTTP (before a certificate) and HTTPS servers.
#
# Web pages are Design Canvas files. They are served byte for byte: the
# runtime re-reads its own page on boot, so nothing may rewrite the HTML.

charset utf-8;
charset_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;
# Videos up to MAX_VIDEO_UPLOAD_MB (50) plus the poster and form fields; photos are 10 MB.
client_max_body_size 60m;
# Every proxied request gets 60 seconds, except the CSV imports below.
proxy_read_timeout 60s;
proxy_send_timeout 60s;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

# --- API and Django admin, proxied to Gunicorn -----------------------------------------
# Password guessing: 10 login or password-change tries a minute per IP, on top
# of Django's lockout (django-axes: 5 failures per username and IP).
location = /api/v1/auth/login/ {
    limit_req zone=gc_login burst=5 nodelay;
    limit_req_status 429;
    include snippets/gramaconnect-proxy.conf;
}
location = /api/v1/auth/session/login/ {
    limit_req zone=gc_login burst=5 nodelay;
    limit_req_status 429;
    include snippets/gramaconnect-proxy.conf;
}
location = /api/v1/auth/password/change/ {
    limit_req zone=gc_login burst=5 nodelay;
    limit_req_status 429;
    include snippets/gramaconnect-proxy.conf;
}
# A citizen post carries any number of photos and videos in one request (contract
# section 15), each still limited by Django (MAX_VIDEO_UPLOAD_MB, MAX_IMAGE_UPLOAD_MB).
location = /api/v1/citizen/posts/ {
    client_max_body_size 200m;
    limit_req zone=gc_api burst=60 nodelay;
    limit_req_status 429;
    include snippets/gramaconnect-proxy.conf;
}
# CSV imports: a whole state's villages in one file. Gunicorn's --timeout is 300 to match.
location ~ ^/api/v1/(geo/villages|admin/contacts)/import/$ {
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    limit_req zone=gc_api burst=60 nodelay;
    limit_req_status 429;
    include snippets/gramaconnect-proxy.conf;
}
location /api/ {
    limit_req zone=gc_api burst=60 nodelay;
    limit_req_status 429;
    include snippets/gramaconnect-proxy.conf;
}
# Django admin opens only from the office (OFFICE_IPS in config.env). With no
# office IPs it is blocked for everyone; the console at /console/ is not affected.
location /django-admin/ {
@DJANGO_ADMIN_ACCESS@
    include snippets/gramaconnect-proxy.conf;
}

# --- Django static files and uploaded media ----------------------------------------------
location /static/ {
    alias @STATIC_ROOT@/;
    expires 30d;
    access_log off;
}
location /media/ {
    alias @GC_MEDIA@/;
    expires 7d;
    access_log off;
    # Nginx answers Range requests for files by default, so video players can seek
    # and resume MP4 and MOV posts (video/mp4 and video/quicktime from mime.types).
    # Uploads are images and videos only; never let a browser run anything from here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
}

# --- Super Admin console: @WWW_DIR@/console (dist/console/ of the BVTGramaConnect build) ----------
location = /console {
    return 301 /console/;
}
location ^~ /console/ {
    root @WWW_DIR@;
    index index.html;
    try_files $uri $uri/ =404;
    include snippets/gramaconnect-security.conf;

    location ~ ^/console/(vendor|_ds|assets)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }
    location = /console/index.html {
        add_header Cache-Control "no-cache" always;
        include snippets/gramaconnect-security.conf;
    }
    location = /console/support.js {
        add_header Cache-Control "no-cache" always;
    }
}

# --- Public website: @WWW_DIR@/public (dist/ of the BVTGramaConnect build) -----------------
location / {
    root @WWW_DIR@/public;
    index index.html;
    try_files $uri $uri/ =404;
    include snippets/gramaconnect-security.conf;

    # Next.js names these files by their content or build id, so they never change.
    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
    location ~ ^/(vendor|_ds|assets)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }
    # Every page (/about/ ends here through index.html) is checked again on each visit,
    # so a new build shows at once and never asks for old /_next/ files.
    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
        include snippets/gramaconnect-security.conf;
    }
    location = /support.js {
        add_header Cache-Control "no-cache" always;
    }
}
