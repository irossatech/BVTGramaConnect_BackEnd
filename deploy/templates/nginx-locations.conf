# Managed by BVT Grama Connect deploy/setup.sh. Edit the template, not this file.
# Everything the site serves. Included by the HTTP (before a certificate) and HTTPS servers.
#
# Web pages are Design Canvas files. They are served byte for byte: the
# runtime re-reads its own page on boot, so nothing may rewrite the HTML.

charset utf-8;
charset_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;
# Videos up to MAX_VIDEO_UPLOAD_MB (50) plus the poster and form fields; photos are 10 MB.
client_max_body_size 60m;
# Every proxied request gets 60 seconds, except the CSV imports below.
proxy_read_timeout 60s;
proxy_send_timeout 60s;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

# --- API and Django admin, proxied to Gunicorn -----------------------------------------
# Password guessing: 10 login or password-change tries a minute per IP, on top
# of Django's lockout (django-axes: 5 failures per username and IP).
location = /api/v1/auth/login/ {
    limit_req zone=gc_login burst=5 nodelay;
    limit_req_status 429;
    include snippets/gramaconnect-proxy.conf;
}
location = /api/v1/auth/session/login/ {
    limit_req zone=gc_login burst=5 nodelay;
    limit_req_status 429;
    include snippets/gramaconnect-proxy.conf;
}
location = /api/v1/auth/password/change/ {
    limit_req zone=gc_login burst=5 nodelay;
    limit_req_status 429;
    include snippets/gramaconnect-proxy.conf;
}
# A citizen post carries any number of photos and videos in one request (contract
# section 15), each still limited by Django (MAX_VIDEO_UPLOAD_MB, MAX_IMAGE_UPLOAD_MB).
location = /api/v1/citizen/posts/ {
    client_max_body_size 200m;
    limit_req zone=gc_api burst=60 nodelay;
    limit_req_status 429;
    include snippets/gramaconnect-proxy.conf;
}
# Home banner ads with a video of up to ADS_VIDEO_MAX_MB (60) plus the form fields (contract
# section 17): a new ad, and a change to one. Django still checks the video's own size.
location ~ ^/api/v1/admin/ads/(\d+/)?$ {
    client_max_body_size 70m;
    proxy_read_timeout 120s;
    limit_req zone=gc_api burst=60 nodelay;
    limit_req_status 429;
    include snippets/gramaconnect-proxy.conf;
}
# CSV imports: a whole state's villages in one file. Gunicorn's --timeout is 300 to match.
location ~ ^/api/v1/(geo/villages|admin/contacts)/import/$ {
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    limit_req zone=gc_api burst=60 nodelay;
    limit_req_status 429;
    include snippets/gramaconnect-proxy.conf;
}
# The public citizen feed, cached for the 60 s its Cache-Control allows. The key holds the whole
# address (village_id, cursor, q) and Accept-Language, because area names follow the language.
# Only one request per key reaches Django; the rest wait for it. Requests with a login (an
# Authorization header or a console session) are never cached or served from the cache.
location ^~ /api/v1/feed/ {
    limit_req zone=gc_api burst=60 nodelay;
    limit_req_status 429;
    proxy_cache gc_feed;
    proxy_cache_key "$scheme$host$request_uri|$http_accept_language";
    proxy_cache_valid 200 60s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale updating error timeout;
    proxy_cache_bypass $http_authorization $cookie_sessionid;
    proxy_no_cache $http_authorization $cookie_sessionid;
    add_header X-Cache-Status $upstream_cache_status always;
    include snippets/gramaconnect-proxy.conf;
}
location /api/ {
    limit_req zone=gc_api burst=60 nodelay;
    limit_req_status 429;
    include snippets/gramaconnect-proxy.conf;
}
# Shared links (apps.share): a shared post's page (/p/<code>/, server-rendered for WhatsApp's
# preview), the invite link (/app/) and the Android App Links file. Django sets their own cache
# and security headers.
location ^~ /p/ {
    limit_req zone=gc_api burst=60 nodelay;
    limit_req_status 429;
    include snippets/gramaconnect-proxy.conf;
}
location ~ ^/app/?$ {
    limit_req zone=gc_api burst=60 nodelay;
    limit_req_status 429;
    include snippets/gramaconnect-proxy.conf;
}
location = /.well-known/assetlinks.json {
    include snippets/gramaconnect-proxy.conf;
}
# Django admin opens only from the office (OFFICE_IPS in config.env). With no
# office IPs it is blocked for everyone; the console at /console/ is not affected.
location /django-admin/ {
@DJANGO_ADMIN_ACCESS@
    include snippets/gramaconnect-proxy.conf;
}

# --- Django static files and uploaded media ----------------------------------------------
location /static/ {
    alias @STATIC_ROOT@/;
    expires 30d;
    access_log off;
    add_header X-Content-Type-Options "nosniff" always;
}
location /media/ {
    alias @GC_MEDIA@/;
    expires 7d;
    access_log off;
    # Nginx answers Range requests for files by default, so video players can seek
    # and resume MP4 and MOV posts (video/mp4 and video/quicktime from mime.types).
    # Uploads are images and videos only; never let a browser run anything from here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
}

# A location with its own add_header loses every add_header of the location around it, so the
# asset and script locations below include the security headers again (nosniff matters for scripts).

# --- Super Admin console: @WWW_DIR@/console (dist/console/ of the BVTGramaConnect build) ----------
location = /console {
    return 301 /console/;
}
location ^~ /console/ {
    root @WWW_DIR@;
    index index.html;
    try_files $uri $uri/ =404;
    include snippets/gramaconnect-security.conf;

    location ~ ^/console/(vendor|_ds|assets|fonts)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/gramaconnect-security.conf;
        access_log off;
    }
    location = /console/index.html {
        add_header Cache-Control "no-cache" always;
        include snippets/gramaconnect-security.conf;
    }
    location = /console/support.js {
        add_header Cache-Control "no-cache" always;
        include snippets/gramaconnect-security.conf;
    }
}

# --- Public website: @WWW_DIR@/public (dist/ of the BVTGramaConnect build) -----------------
location / {
    root @WWW_DIR@/public;
    index index.html;
    try_files $uri $uri/ =404;
    include snippets/gramaconnect-security.conf;

    # Next.js names these files by their content or build id, so they never change.
    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/gramaconnect-security.conf;
        access_log off;
    }
    location ~ ^/(vendor|_ds|assets|fonts)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/gramaconnect-security.conf;
        access_log off;
    }
    # Every page (/about/ ends here through index.html) is checked again on each visit,
    # so a new build shows at once and never asks for old /_next/ files.
    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
        include snippets/gramaconnect-security.conf;
    }
    location = /support.js {
        add_header Cache-Control "no-cache" always;
        include snippets/gramaconnect-security.conf;
    }
    # The app's APK (dist/downloads/) keeps its name from one version to the next, so every
    # download checks for a newer file. Nginx's mime.types sends it as an Android package.
    location ^~ /downloads/ {
        add_header Cache-Control "no-cache" always;
        include snippets/gramaconnect-security.conf;
        access_log off;
    }
}
