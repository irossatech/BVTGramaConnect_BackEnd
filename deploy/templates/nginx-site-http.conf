# Managed by BVT Grama Connect deploy/setup.sh. Plain HTTP, used only until
# Let's Encrypt has issued a certificate; setup.sh then switches to the HTTPS file.

# No nginx version in error pages and the Server header.
server_tokens off;

limit_req_zone $binary_remote_addr zone=gc_login:10m rate=10r/m;

# Like "combined" but without the query string: searches such as
# /api/v1/users/?q=<email or mobile> must not put personal data in the logs.
log_format gc_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
limit_req_zone $binary_remote_addr zone=gc_api:10m rate=20r/s;
# The citizen feed for 60 s (its own Cache-Control), so a push to a whole district does not send
# every phone there to the database at once. See /api/v1/feed/ in gramaconnect-locations.conf.
proxy_cache_path /var/cache/nginx/gc_feed levels=1:2 keys_zone=gc_feed:10m max_size=50m inactive=5m use_temp_path=off;

upstream gramaconnect_app {
    server unix:@GC_SOCKET@ fail_timeout=0;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name @SERVER_NAMES@;

    access_log /var/log/nginx/gramaconnect.access.log gc_noquery;
    error_log  /var/log/nginx/gramaconnect.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    include snippets/gramaconnect-locations.conf;
}
