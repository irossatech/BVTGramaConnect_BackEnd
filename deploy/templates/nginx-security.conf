# Managed by BVT Grama Connect deploy/setup.sh. Headers for the web pages.
#
# The pages are a static Next.js build: no inline scripts and no eval, so scripts need only
# 'self' (no 'unsafe-eval' since 2026-11-12, web audit WEB-SEC-001). Inline styles stay allowed:
# the markup keeps the prototype's inline styles (docs/prototype-inventory.md, section 5).
# Scripts, styles and fonts come from this site only: the website and the console serve their
# fonts from /fonts/, nothing from Google.
# No `data:` fonts or pictures since 2026-11-16 (web audit WEB-SEC-003/WEB-HDR-001): the build uses
# none, checked in Chrome on every website page and console screen under this policy. `blob:` stays
# for the console's photo and video previews.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' @CSP_SCRIPT_EXTRA@; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
# The pages never use the camera, microphone, location, payment or USB: the browser refuses them,
# even to injected code (WEB-SEC-003). A window that opens the console keeps no handle on it (COOP,
# WEB-HDR-001). Django sends COOP on the API itself (SECURE_CROSS_ORIGIN_OPENER_POLICY).
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
@HSTS_HEADER@
