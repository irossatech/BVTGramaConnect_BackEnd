# Managed by BVT Grama Connect deploy/setup.sh. Headers for the web pages.
#
# The pages are a static Next.js build: no inline scripts and no eval, so scripts need only
# 'self' (no 'unsafe-eval' since 2026-11-12, web audit WEB-SEC-001). Inline styles stay allowed:
# the markup keeps the prototype's inline styles (docs/prototype-inventory.md, section 5).
# Scripts, styles and fonts come from this site only: the website and the console serve their
# fonts from /fonts/, nothing from Google.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' @CSP_SCRIPT_EXTRA@; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
@HSTS_HEADER@
