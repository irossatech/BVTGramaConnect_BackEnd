# Managed by BVT Grama Connect deploy/setup.sh. Headers for the web pages.
#
# The Design Canvas runtime builds the pages with `new Function` and the markup
# uses inline styles, so the policy allows 'unsafe-eval' and inline styles
# (docs/prototype-inventory.md, section 5.6). Scripts come from this site only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' @CSP_SCRIPT_EXTRA@; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
@HSTS_HEADER@
