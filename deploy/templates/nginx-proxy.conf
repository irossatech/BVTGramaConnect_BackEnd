# Managed by BVT Grama Connect deploy/setup.sh. Included by every proxied location.
proxy_pass http://gramaconnect_app;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_redirect off;
# The timeouts are set in gramaconnect-locations.conf: a location that includes this
# file could not set them again ("directive is duplicate"), and the imports need more.
