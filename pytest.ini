[pytest]
DJANGO_SETTINGS_MODULE = grama.settings
python_files = tests.py test_*.py
testpaths = apps grama
addopts = -ra --strict-markers -p grama.testsuite_plugin
# Markers come from grama/tests/suite.json through that plugin: each category's key, the stage
# markers it maps to (unit, integration, rbac, contract, security, db, concurrency, jobs, errors),
# and "unit" for every test that never touches the database. Example: pytest -m rbac
