<!doctype html>
<html lang="{% block lang %}te{% endblock %}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>{% block title %}BVT Grama Connect{% endblock %}</title>
{% block meta %}{% endblock %}
<style>
  :root { --brand: #1f6f43; --brand-ink: #ffffff; --ink: #1d2320; --muted: #5d6762; --line: #e3e8e5; --paper: #ffffff; --page: #f4f6f5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.6 "Noto Sans Telugu", "Noto Sans", system-ui, sans-serif; }
  header { background: var(--brand); color: var(--brand-ink); padding: 12px 16px; font-weight: 700; font-size: 17px; }
  header a { color: inherit; text-decoration: none; }
  main { max-width: 680px; margin: 0 auto; padding: 16px; }
  article { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .pill { background: #e6f2eb; color: var(--brand); border-radius: 999px; padding: 2px 10px; font-weight: 600; }
  .urgent { background: #fdecea; color: #b3261e; }
  h1 { font-size: 22px; line-height: 1.35; margin: 12px 0 8px; }
  h2 { font-size: 15px; color: var(--muted); margin: 20px 0 4px; }
  .body { white-space: pre-line; overflow-wrap: anywhere; }
  img, video { display: block; width: 100%; height: auto; border-radius: 8px; margin: 12px 0 0; background: #dfe5e2; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 4px; }
  .button { flex: 1 1 200px; text-align: center; padding: 12px 16px; border-radius: 10px; font-weight: 700; text-decoration: none; border: 2px solid var(--brand); }
  .primary { background: var(--brand); color: var(--brand-ink); }
  .secondary { color: var(--brand); background: var(--paper); }
  footer { color: var(--muted); font-size: 14px; text-align: center; padding: 16px; }
  footer a { color: var(--brand); }
</style>
</head>
<body>
<header><a href="{{ website_url }}">BVT Grama Connect</a></header>
<main>
{% block content %}{% endblock %}
</main>
<footer>{% block footer %}<a href="{{ website_url }}">{{ website_url }}</a>{% endblock %}</footer>
</body>
</html>
